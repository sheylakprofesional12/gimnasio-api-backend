# ============================================================
#  imagen.yml — PIPELINE SIMPLE
#  Cada vez que subes código a main, GitHub:
#    1. baja tu código
#    2. construye la imagen con tu Dockerfile
#    3. la publica en ghcr.io (el registro de imágenes de GitHub)
#
#  Va en: .github/workflows/imagen.yml
#  Resultado: ghcr.io/<tu-usuario>/<tu-repositorio>:latest
#             ghcr.io/<tu-usuario>/<tu-repositorio>:sha-xxxxxxx
# ============================================================
name: Imagen Docker

on:
  push:
    branches: [main]
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: read              # leer el código
  packages: write             # publicar en ghcr.io

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      - name: Nombre de la imagen (ghcr.io exige minúsculas)
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CORTO=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub lo crea solo, no hay que configurarlo

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:sha-${{ env.CORTO }}
